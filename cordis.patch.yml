- insert:
    - id: vocechat-bridge
      name: dsh-vocechat-bridge
      config:
        enabled: false
        baseUrl: ''
        botUid: 0
        targetSessionId: ''
        botApiKeyRef: VOCECHAT_BOT_API_KEY
        webhookSecretRef: ''
        webhookHost: 127.0.0.1
        webhookPort: 8898
        webhookPath: /vocehook
        userWhitelist: []
        groupWhitelist: []
        privateQuietMs: 4000
        groupQuietMs: 1500
        maxWaitMs: 12000
        voiceEnabled: true
        asrEnabled: false
        asrProvider: openai
        ttsEnabled: false
        ttsProvider: openai
        allowProactive: false

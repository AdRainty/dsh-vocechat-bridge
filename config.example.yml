# 在 profile 的 cordis.patch.yml 按 id 覆盖；服务凭据由 credentials 服务或环境变量提供。
# 域名为占位值，身份与白名单默认未配置；填写自己的值后才启用。
- id: vocechat-bridge
  config:
    enabled: false
    baseUrl: 'https://chat.example.com'
    botUid: 0 # 填写实际 Bot UID
    botApiKeyRef: VOCECHAT_BOT_API_KEY
    webhookSecretRef: '' # 认证模式填凭据引用（如 VOCECHAT_WEBHOOK_TOKEN），Webhook URL 用 ?secret=实际令牌；VoceChat 的 set secret 加密接口不启用
    webhookHost: 127.0.0.1
    webhookPort: 8898
    webhookPath: /vocehook
    targetSessionId: '' # 填写实际已有 Session ID
    agentPreset: ''
    userWhitelist: [] # 按需填写允许私聊的 UID
    groupWhitelist: [] # 按需填写允许接收的 GID
    groupSenderWhitelist: []
    autoReply: true
    allowProactive: false
    allowedLocalRoots: [] # DSH 工具默认使用宿主文件读取权限；填写目录时增加额外限制，支持 ~/
    allowedRemoteOrigins: [] # 按需填写允许下载媒体的完整 origin
    statePath: ''
    tempDir: ''
    requestTimeoutMs: 30000
    turnTimeoutMs: 180000
    maxMediaBytes: 26214400
    maxAudioSeconds: 300
    maxBodyBytes: 262144
    maxQueue: 200
    maxHistory: 5000
    maxTextChars: 16000
    textSegmentChars: 2000
    privateQuietMs: 4000
    groupQuietMs: 1500
    maxWaitMs: 12000
    maxBatch: 10
    historyContextMessages: 6 # 每批附带前面的同会话历史；0 关闭，最大 50
    historyMaxChars: 12000 # 历史结果 JSON 字符预算，超限优先保留较新的消息
    historyTimeoutMs: 5000 # 查询失败不阻塞新消息
    dedupTtlMs: 86400000
    retentionMs: 86400000
    logLevel: info
    voiceEnabled: true # 总开关；ASR / TTS 默认仍分别关闭
    asrEnabled: false
    asrProvider: openai # openai / mimo
    asrBaseUrl: '' # 留空使用厂家官方地址；本地 Whisper 可填 http://127.0.0.1:8000/v1
    asrModel: '' # openai 默认 whisper-1；mimo 默认 mimo-v2.5-asr
    asrAcceptedFormats: ['wav', 'mp3', 'ogg', 'm4a', 'flac', 'webm'] # 仅接受 WAV 的服务改为 ['wav']，自动转码
    asrApiKeyRef: OPENAI_API_KEY # 小米填 MIMO_API_KEY；本地无鉴权服务可留空
    asrLanguage: zh
    asrTimeoutMs: 60000
    ffmpegPath: ffmpeg
    ffprobePath: ffprobe
    ttsEnabled: false
    ttsProvider: openai # openai / mimo
    ttsBaseUrl: ''
    ttsModel: '' # openai 默认 gpt-4o-mini-tts；mimo 默认 mimo-v2.5-tts
    ttsApiKeyRef: OPENAI_API_KEY
    ttsVoice: '' # openai 默认 alloy；mimo 默认 mimo_default
    ttsInstructions: '' # 声线与语气；MiMo voicedesign 模型必填
    ttsFormat: wav # wav / mp3
    ttsTimeoutMs: 120000
    audioUnderstandingProvider: ''

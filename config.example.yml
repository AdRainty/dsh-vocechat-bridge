# 在 profile 的 cordis.patch.yml 按 id 覆盖；服务凭据由 credentials 服务或环境变量提供。
# 本示例不用旧桥接的8899端口，不会覆盖旧配置；填好后才启用。
- id: vocechat-bridge
  config:
    enabled: false
    baseUrl: 'https://chat.example.com'
    botUid: 2
    botApiKeyRef: VOCECHAT_BOT_API_KEY
    webhookSecretRef: VOCECHAT_WEBHOOK_SECRET # 插件 POST 访问令牌引用；VoceChat 后台的可选 AES secret 留空
    webhookHost: 127.0.0.1
    webhookPort: 8898
    webhookPath: /vocehook
    targetSessionId: 'session-REPLACE-ME'
    agentPreset: ''
    userWhitelist: [100]
    groupWhitelist: [10]
    groupSenderWhitelist: []
    autoReply: true
    allowProactive: false
    allowedLocalRoots: ['K:/Shared/vocechat-outgoing']
    allowedRemoteOrigins: ['https://media.example.com']
    statePath: ''
    tempDir: ''
    requestTimeoutMs: 30000
    turnTimeoutMs: 180000
    maxMediaBytes: 26214400
    maxAudioSeconds: 300
    maxBodyBytes: 262144
    maxQueue: 200
    maxHistory: 5000
    maxTextChars: 16000
    textSegmentChars: 2000
    privateQuietMs: 4000
    groupQuietMs: 1500
    maxWaitMs: 12000
    maxBatch: 10
    dedupTtlMs: 86400000
    retentionMs: 86400000
    logLevel: info
    voiceEnabled: true # 总开关；ASR / TTS 默认仍分别关闭
    asrEnabled: false
    asrProvider: openai # openai / mimo
    asrBaseUrl: '' # 留空使用厂家官方地址；本地 Whisper 可填 http://127.0.0.1:8000/v1
    asrModel: '' # openai 默认 whisper-1；mimo 默认 mimo-v2.5-asr
    asrAcceptedFormats: ['wav', 'mp3', 'ogg', 'm4a', 'flac', 'webm'] # 仅接受 WAV 的服务改为 ['wav']，自动转码
    asrApiKeyRef: OPENAI_API_KEY # 小米填 MIMO_API_KEY；本地无鉴权服务可留空
    asrLanguage: zh
    asrTimeoutMs: 60000
    ffmpegPath: ffmpeg
    ffprobePath: ffprobe
    ttsEnabled: false
    ttsProvider: openai # openai / mimo
    ttsBaseUrl: ''
    ttsModel: '' # openai 默认 gpt-4o-mini-tts；mimo 默认 mimo-v2.5-tts
    ttsApiKeyRef: OPENAI_API_KEY
    ttsVoice: '' # openai 默认 alloy；mimo 默认 mimo_default
    ttsInstructions: '' # 声线与语气；MiMo voicedesign 模型必填
    ttsFormat: wav # wav / mp3
    ttsTimeoutMs: 120000
    audioUnderstandingProvider: ''
